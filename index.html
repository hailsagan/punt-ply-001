/* ============================================================= PLY-001
   Landing = exact PRE-002 board (transplanted into an isolated iframe).
   Overlay = currency modal + REVIEW bar + UX-notes drawer (this document's styles).
   ============================================================= */
:root{
  --bg:#ffffff; --panel:#ffffff; --surface:#f4f4f4; --surface-2:#ececec;
  --ink:#1a1a1a; --ink-2:#535353; --muted:#767676; --faint:#9b9b9b;
  --line:#e4e4e4; --line-2:#d4d4d4; --line-strong:#bcbcbc;
  --fill:#1a1a1a; --on-fill:#ffffff;
  --accent:#1a1a1a; --accent-2:#1a1a1a;
  --r:10px; --r-lg:14px;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(26,26,26,.04);
  --shadow-lg:0 18px 48px -20px rgba(26,26,26,.26);
  --rbar-h:52px;
}
:root[data-skin="brand"]{
  --bg:#0d0d0e; --panel:#141416; --surface:#1c1c20; --surface-2:#26262b;
  --ink:#f4f4ef; --ink-2:#b6b6b0; --muted:#9b9b94; --faint:#6f6f68;
  --line:rgba(244,244,239,.10); --line-2:rgba(244,244,239,.16); --line-strong:rgba(244,244,239,.26);
  --fill:#f4f4ef; --on-fill:#141416;
  --accent:#b6fb6f; --accent-2:#ff5a36;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 22px 56px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
.pre{font-family:var(--sans); color:var(--ink); background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.45}

/* ---- background board (iframe) ---- */
#stage{position:relative; min-height:100vh; background:var(--bg)}
#boardframe{position:fixed; left:0; top:0; width:100%; height:calc(100vh - var(--rbar-h)); border:0; display:block; background:var(--bg); z-index:1}
#reopen{position:fixed; left:0; top:0; width:100%; height:calc(100vh - var(--rbar-h)); z-index:40; border:0; background:transparent; cursor:pointer; padding:0}

/* ---- primitives ---- */
.kicker{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.h-lg{font-size:26px; font-weight:700; letter-spacing:-.022em; line-height:1.12; margin:0; text-wrap:balance}
.txt{font-size:13.5px; color:var(--ink-2); margin:8px 0 0; max-width:60ch}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.row{display:flex; align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto; min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.stack{display:flex; flex-direction:column}.gap10{gap:10px}

.btn{font-family:var(--sans); font-size:14px; font-weight:600; border-radius:9px; padding:13px 16px;
  border:1px solid var(--accent); background:var(--accent); color:var(--on-fill); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  transition:transform .12s, opacity .12s; text-align:center}
.btn:hover{opacity:.9}.btn:active{transform:translateY(1px)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:8px}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card.flat{box-shadow:none; background:var(--surface)}
.cat{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  border:1px solid var(--line-2); border-radius:6px; padding:3px 7px; display:inline-block}

/* coins */
.coins{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
@media (max-width:460px){ .coins{grid-template-columns:1fr} }

/* analogy cards */
.anacard{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface)}
.anacard .an-ttl{font-size:19px; font-weight:700; letter-spacing:-.01em}
.anacard p{margin:8px 0 0; font-size:13px; color:var(--ink-2); line-height:1.5}
.anacard p b{color:var(--ink); font-weight:650}

/* game card + success */
.game{display:flex; gap:13px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--panel)}
.gicon{width:44px; height:44px; border-radius:11px; background:var(--surface-2); display:grid; place-items:center; flex:0 0 auto}
.gicon svg{width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:1.7}
.gname{font-size:15px; font-weight:640}
.gsub{font-size:12px; color:var(--muted); margin-top:3px}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.stat{border:1px solid var(--line); border-radius:11px; padding:13px}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:var(--mono); font-size:19px; font-weight:640; margin-top:6px; font-variant-numeric:tabular-nums}
.stat.hero2{background:var(--accent); border-color:var(--accent)}
.stat.hero2 .k{color:var(--on-fill); opacity:.62}
.stat.hero2 .v{color:var(--on-fill)}
.recap{display:flex; gap:12px; align-items:flex-start; padding:12px 0}
.recap+.recap{border-top:1px solid var(--line)}
.recap .rk{font-size:13.5px; font-weight:640}
.recap .rv{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.tick{width:20px; height:20px; border-radius:50%; background:var(--fill); color:var(--on-fill); display:grid; place-items:center; flex:0 0 auto; margin-top:1px}
.tick svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.2}
.badge{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:100px; border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap}
.badge.solid{background:var(--accent); color:var(--on-fill); border-color:var(--accent); display:inline-flex; gap:6px; align-items:center}
.badge.solid .tick{width:14px; height:14px; background:transparent; color:var(--on-fill); margin:0}
.why{border:1px solid var(--line); border-left:2px solid var(--ink); border-radius:9px; padding:11px 13px; background:var(--surface); font-size:12px; color:var(--ink-2); margin-top:14px}
.why b{color:var(--ink); font-weight:600}
.anim{animation:enter .34s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* toast */
.toast{position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px); background:var(--fill); color:var(--on-fill);
  font-size:12.5px; font-weight:500; padding:10px 16px; border-radius:100px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:.25s; z-index:120; font-family:var(--mono); letter-spacing:.02em; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%)}

/* ---- modal ---- */
#modalroot{position:relative; z-index:80}
.modalback{position:fixed; inset:0; background:rgba(10,10,12,.5); z-index:80; display:flex; align-items:center; justify-content:center;
  padding:24px; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel); border:1px solid var(--line-2); border-radius:18px; width:min(560px,100%); max-height:88vh;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg); overflow:hidden; animation:rise .28s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
.modal-closerow{display:flex; justify-content:flex-end; padding:12px 12px 0; flex:0 0 auto}
.mh-close{width:30px; height:30px; border-radius:9px; border:1px solid var(--line-2); background:var(--panel); cursor:pointer; display:grid; place-items:center; color:var(--ink-2)}
.mh-close:hover{background:var(--surface)}
.mh-close svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8}
.modal-body{overflow:hidden}
.mpad{padding:8px 22px 22px}

/* ---- REVIEW bar ---- */
.rbar{position:fixed; left:0; right:0; bottom:0; z-index:100; display:flex; align-items:center; gap:20px; height:var(--rbar-h);
  padding:0 16px; background:#141416; color:#f4f4ef; border-top:1px solid rgba(244,244,239,.12); font-family:var(--sans); overflow-x:auto}
.rbar::-webkit-scrollbar{height:0}
.rb-brand{display:flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto}
.rb-code{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:#f4f4ef; font-weight:600}
.rb-tag{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:#8a8a84}
.rb-groups{display:flex; align-items:center; gap:20px}
.seg{display:flex; align-items:center; gap:9px; white-space:nowrap}
.seg-l{font-size:11px; color:#8a8a84}
.seg-pills{display:flex; gap:3px; background:rgba(244,244,239,.07); border-radius:9px; padding:3px}
.seg-pills button{background:none; border:0; cursor:pointer; color:#c9c9c3; font-family:var(--sans); font-size:12px; font-weight:550;
  padding:5px 10px; border-radius:6px; display:flex; align-items:center; gap:5px; white-space:nowrap}
.seg-pills button:hover{color:#fff}
.seg-pills button.on{background:#f4f4ef; color:#141416}
.seg-pills button svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.7}
.rb-actions{margin-left:auto; display:flex; gap:5px; flex:0 0 auto}
.rb-actions button,.rb-actions a{background:none; border:0; cursor:pointer; color:#c9c9c3; font-size:12px; display:flex; align-items:center; gap:6px; padding:6px 9px; border-radius:8px; white-space:nowrap; text-decoration:none; font-family:inherit}
.rb-actions button:hover,.rb-actions a:hover{color:#fff; background:rgba(244,244,239,.08)}
.rb-actions button.on{color:#141416; background:#f4f4ef}
.rb-actions svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7}

/* ---- UX notes drawer ---- */
.notesdrawer{position:fixed; top:0; right:0; bottom:var(--rbar-h); width:344px; max-width:88vw; background:var(--panel);
  border-left:1px solid var(--line-2); box-shadow:var(--shadow-lg); z-index:90; overflow-y:auto; padding:22px;
  transform:translateX(106%); transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.pre[data-notes="on"] .notesdrawer{transform:none}
.nd-top{display:flex; align-items:center; justify-content:space-between}
.nd-title{font-family:var(--mono); font-size:12px; letter-spacing:.04em; font-weight:650; color:var(--ink)}
.nd-pattern{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-top:5px}
.nd-close{width:28px; height:28px; border-radius:8px; border:1px solid var(--line-2); background:var(--panel); cursor:pointer; display:grid; place-items:center; color:var(--ink-2)}
.nd-close svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8}
.nd-sec{margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.nd-sec .tag{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.nd-sec p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-2)}

/* mobile modal (real narrow viewport, not the simulated device toggle) */
@media (max-width:560px){
  .modalback{padding:0; align-items:flex-end}
  .modal{border-radius:18px 18px 0 0; max-height:92vh}
}
.reduced *{animation:none !important}
</style>

<div class="pre" id="pre" data-notes="off" data-device="desktop">
  <div id="stage">
    <iframe id="boardframe" title="Punt Play lobby"></iframe>
    <button id="reopen" aria-label="Open the wallet welcome" hidden></button>
    <div id="modalroot"></div>
  </div>
  <div class="toast" id="toast"></div>

  <aside class="notesdrawer" id="notesdrawer" aria-label="UX notes"></aside>

  <div class="rbar" id="rbar">
    <div class="rb-brand"><span class="rb-code">PLY-001</span><span class="rb-tag">· REVIEW</span></div>
    <div class="rb-groups">
      <div class="seg"><span class="seg-l">Fidelity</span>
        <div class="seg-pills" id="skinpills">
          <button data-fid="midfi">Mid-Fi</button>
          <button data-fid="hifi">Hi-Fi</button>
        </div></div>
      <div class="seg"><span class="seg-l">Device</span>
        <div class="seg-pills" id="devpills">
          <button data-dev="desktop"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Desktop</button>
          <button data-dev="mobile"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>Mobile</button>
        </div></div>
    </div>
    <div class="rb-actions">
      <button id="resetbtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
      <a id="indexbtn" href="https://punt-prototypes-index-7bnw.vercel.app/"><svg viewBox="0 0 24 24"><path d="M4 6h4M4 12h4M4 18h4M11 6h9M11 12h9M11 18h9"/></svg>Index</a>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const pre=$("#pre");
if(matchMedia("(prefers-reduced-motion:reduce)").matches) pre.classList.add("reduced");

const IC={
  slot:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M9 4v16M15 4v16"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const tick=`<span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></span>`;

/* scenario data */
const GC={code:"GC", glyph:"G", name:"Gold Coins", bal:"10,000", tag:"For fun",
  line:"Play everything, just for fun.",
  sub:"Free to top up, always. Not for cashing out — think of them as your practice stack."};
const SC={code:"SC", glyph:"S", name:"Sweeps Coins", bal:"5.00", tag:"For prizes",
  line:"Play for real prizes.",
  sub:"The ones that count. Redeem them for prizes — you can't buy them, they arrive free."};
const GAME={name:"Golden Sevens", sub:"Classic 3-reel · your first play"};

const META={
  v2:{code:"V2",name:"The Plain Answer",pattern:"Direct, plain-language explanation",
      note:"States the difference plainly, framed as 'how this works' rather than a wallet-settings screen: Gold Coins are just for gameplay; Sweeps Coins can be redeemed for real cash prizes, and only ever arrive bundled free with Gold Coins — never purchased. No metaphor, no legalese.",
      move:"Skips illustration and states the mechanic directly, including the one rule that matters most — you can't buy Sweeps Coins. Plain language does the comprehension work a compliance-style disclosure never could.",
      risk:"Being this direct can read as a rules list if the two cards don't stay tightly parallel in length and structure; the friendly 'How This Works' framing has to carry the warmth, since the copy itself is literal rather than illustrative."}
};
const PATH={v2:"1 tap · 10s"};

const S={v:"v2", notes:false, fidelity:"hifi", device:"mobile", modalOpen:false, played:false};
function reset(){ S.played=false; }

/* ---- concept helpers ---- */
function gameCard(coinLabel){
  return `<div class="game"><span class="gicon">${IC.slot}</span>
    <div class="grow"><div class="gname">${GAME.name}</div><div class="gsub">${GAME.sub}</div></div>
    ${coinLabel?`<span class="cat">${coinLabel}</span>`:""}</div>`;
}
function firstPlayScreen(path){
  return `<div class="mpad anim">
    <div class="row between"><span class="kicker" style="margin:0">First play reached</span>
      <span class="badge solid">${tick} Play</span></div>
    <h2 class="h-lg mt8">You're in — first play placed.</h2>
    <p class="txt">Past the two-currency moment and into the game. Getting here instead of bouncing at the wallet is the whole point of PLY-001.</p>
    <div class="mt16">${gameCard("Gold Coins")}</div>
    <div class="statgrid">
      <div class="stat"><div class="k">Path to first play</div><div class="v">${path}</div></div>
      <div class="stat hero2"><div class="k">Bounce risk</div><div class="v">↓ cleared</div></div>
    </div>
    <div class="card flat mt16">
      <span class="kicker" style="margin:0">In their own words</span>
      <div class="recap">${tick}<div><div class="rk">Gold Coins → for fun</div>
        <div class="rv">Play all you like; free to top up, not for cashing out.</div></div></div>
      <div class="recap">${tick}<div><div class="rk">Sweeps Coins → for prizes</div>
        <div class="rv">The redeemable ones — you can't buy them, they come free.</div></div></div>
    </div>
    <div class="why mt16"><b>Why this proves it:</b> the difference landed at the point of confusion, so the player acted instead of dropping off. That's the reduced bounce at the currency-explanation moment and the lift in new registrations reaching first play that PLY-001 tests — the recap doubles as the "can articulate it in their own words" signal, kept clear of compliance-style disclosure.</div>
    <button class="btn mt20" data-a="restart">Run the moment again</button>
  </div>`;
}
const V2={ view(){
  return `<div class="mpad anim">
    <h2 class="h-lg mt8">How This Works</h2>
    <p class="txt">Play any game with Gold Coins or Sweeps Coins.<br>You can switch between coins at any time.</p>
    <div class="coins mt16">
      <div class="anacard">
        <div class="an-ttl">Play for fun</div>
        <p><b>Gold Coins</b> are just for gameplay.</p>
        <p>You can buy Gold Coins or collect extra coins for free.</p></div>
      <div class="anacard">
        <div class="an-ttl">Play for prizes</div>
        <p><b>Sweeps Coins</b> can be redeemed for real cash prizes.</p>
        <p>You can't buy Sweeps Coins, but you can get them for free bundled with Gold Coins.</p></div>
    </div>
    <button class="btn mt16" data-a="close">Got it, let's go</button>
  </div>`;
}};
const V={v2:V2};

/* ---- toast ---- */
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1700);}

/* ---- background board (exact PRE-002 transplant, isolated in an iframe) ---- */
const frame=$("#boardframe");
const boardCSS=$("#boardcss").textContent;
const boardHTML=$("#boardhtml").textContent;
function themeAttr(){ return S.fidelity==="hifi"?"hifi":"midfi"; }
function writeBoard(){
  const doc=frame.contentDocument||frame.contentWindow.document;
  doc.open();
  doc.write('<!doctype html><html lang="en" data-punt-theme="'+themeAttr()+'"><head><meta charset="utf-8"><style>'+boardCSS+'</style></head><body>'+boardHTML+'</body></html>');
  doc.close();
  syncDevice();
}
function syncSkin(){ try{ const d=frame.contentDocument; if(d) d.documentElement.setAttribute("data-punt-theme",themeAttr()); }catch(e){} }
function syncDevice(){ try{ const d=frame.contentDocument; if(d) d.querySelectorAll("[data-device]").forEach(el=>el.setAttribute("data-device",S.device)); }catch(e){} }

/* anchor the modal to the bottom of the board's own phone-frame rect (not the browser viewport) */
function alignMobileModal(){
  const modalEl=document.querySelector(".modal");
  if(!modalEl) return;
  if(S.device!=="mobile"){ modalEl.style.cssText=""; return; }
  let inner;
  try{ const doc=frame.contentDocument; inner=doc.querySelector("._frame_lazny_32")||doc.querySelector("._stage_lazny_16"); }
  catch(e){ inner=null; }
  if(!inner){ modalEl.style.cssText=""; return; }
  const ir=inner.getBoundingClientRect(), fr=frame.getBoundingClientRect();
  const absLeft=fr.left+ir.left, absTop=fr.top+ir.top, absRight=fr.left+ir.right, absBottom=fr.top+ir.bottom;
  const width=Math.round(Math.min(380,ir.width-32));
  const maxH=Math.round(ir.height*0.86);
  const centerX=(absLeft+absRight)/2, centerY=(absTop+absBottom)/2;
  modalEl.style.position="fixed";
  modalEl.style.margin="0";
  modalEl.style.width=width+"px";
  modalEl.style.maxHeight=maxH+"px";
  modalEl.style.left=Math.round(centerX-width/2)+"px";
  const h=modalEl.getBoundingClientRect().height;
  modalEl.style.top=Math.round(centerY-h/2)+"px";
}

/* ---- modal ---- */
function currentBodyHTML(){ return S.played ? firstPlayScreen(PATH[S.v]) : V[S.v].view(); }
function modalView(bodyHTML){
  return `<div class="modalback" data-a="close">
    <div class="modal" data-a="noop" role="dialog" aria-modal="true">
      <div class="modal-closerow"><button class="mh-close" data-a="close" aria-label="Close">${IC.close}</button></div>
      <div class="modal-body">${bodyHTML}</div>
    </div>
  </div>`;
}
/* smooth content swap for an already-open modal — no re-mount, no replayed open animation */
let modalMounted=false, lastBodyHTML=null, autoPromptTimer=null;
function swapModalBody(html){
  const body=document.querySelector(".modal-body");
  if(!body) return;
  const startH=body.getBoundingClientRect().height;
  body.style.transition="none";
  body.style.height=startH+"px";
  body.style.overflow="hidden";
  body.innerHTML=html;
  requestAnimationFrame(()=>{
    const endH=body.scrollHeight;
    body.style.transition="height .22s cubic-bezier(.2,.7,.2,1)";
    body.style.height=endH+"px";
  });
  clearTimeout(swapModalBody._t);
  swapModalBody._t=setTimeout(()=>{
    body.style.height="";
    body.style.overflow="";
    body.style.transition="";
  },240);
}
/* board-first beat: close the modal, then auto-prompt it again after a delay */
function scheduleAutoPrompt(){
  autoPromptTimer=setTimeout(()=>{ S.modalOpen=true; paint(); },2000);
}

/* ---- notes ---- */
function renderNotes(){
  const m=META[S.v];
  $("#notesdrawer").innerHTML=`<div class="nd-top"><div>
      <div class="nd-title">${m.code} · ${m.name}</div>
      <div class="nd-pattern">${m.pattern}</div>
    </div><button class="nd-close" data-a="notesclose" aria-label="Close notes">${IC.close}</button></div>
    <div class="nd-sec"><span class="tag">The pattern</span><p>${m.note}</p></div>
    <div class="nd-sec"><span class="tag">Why this concept</span><p>${m.move}</p></div>
    <div class="nd-sec"><span class="tag">Considerations</span><p>${m.risk}</p></div>`;
}

/* ---- paint ---- */
function paint(){
  if(autoPromptTimer){ clearTimeout(autoPromptTimer); autoPromptTimer=null; }
  if(S.modalOpen){
    const bodyHTML=currentBodyHTML();
    if(!modalMounted){
      $("#modalroot").innerHTML=modalView(bodyHTML);
      modalMounted=true;
    } else if(bodyHTML!==lastBodyHTML){
      swapModalBody(bodyHTML);
    }
    lastBodyHTML=bodyHTML;
  } else {
    $("#modalroot").innerHTML="";
    modalMounted=false;
    lastBodyHTML=null;
  }
  $("#reopen").hidden = S.modalOpen;
  renderNotes();
  document.querySelectorAll("#skinpills button").forEach(b=>b.classList.toggle("on",b.dataset.fid===S.fidelity));
  document.querySelectorAll("#devpills button").forEach(b=>b.classList.toggle("on",b.dataset.dev===S.device));
  pre.setAttribute("data-notes",S.notes?"on":"off");
  pre.setAttribute("data-device",S.device);
  alignMobileModal();
}

/* ---- events ---- */
$("#modalroot").addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="noop")return;
  if(a==="close"){S.modalOpen=false;paint();return;}
  if(a==="restart"){reset();S.modalOpen=true;paint();return;}
  if(a==="play"){S.played=true;toast("First play placed");paint();return;}
});
$("#reopen").addEventListener("click",()=>{S.modalOpen=true;paint();});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.modalOpen){S.modalOpen=false;paint();} });
window.addEventListener("resize",()=>{ if(S.device==="mobile") alignMobileModal(); });

/* ---- review bar ---- */
$("#skinpills").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S.fidelity=b.dataset.fid; document.documentElement.setAttribute("data-skin",S.fidelity==="hifi"?"brand":""); syncSkin(); paint();});
$("#devpills").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S.device=b.dataset.dev; syncDevice(); paint();});
$("#resetbtn").addEventListener("click",()=>{ reset(); S.modalOpen=false; paint(); scheduleAutoPrompt(); });
$("#notesdrawer").addEventListener("click",e=>{ if(e.target.closest('[data-a="notesclose"]')){ S.notes=false; paint(); } });

document.documentElement.setAttribute("data-skin",S.fidelity==="hifi"?"brand":"");
writeBoard();
paint();
scheduleAutoPrompt();
})();
</script>
</body>
</html>
